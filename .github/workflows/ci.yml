name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Verificacion completa del sitio: tipos y plantillas (astro check), build
  # estatico y comprobacion de los enlaces internos del resultado.
  sitio:
    name: Sitio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar (tipos, build y enlaces)
        run: npm run verificar:todo
